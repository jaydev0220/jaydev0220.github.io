name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm content:validate

      - name: Check types and Svelte
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Check formatting and lint
        run: pnpm lint

      - name: Build deployables
        run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PUBLIC_CONTACT_API_ORIGIN: https://contact.mengche.dev
          PUBLIC_CF_ANALYTICS_TOKEN: ''

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PUBLIC_CONTACT_API_ORIGIN: https://contact.mengche.dev
          PUBLIC_CF_ANALYTICS_TOKEN: ''

      - name: Run Lighthouse CI
        run: |
          export CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | sort | tail -1)"
          pnpm lighthouse
