name: Deploy inquiry Worker

on:
  workflow_run:
    workflows: [Validate]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Worker
        run: pnpm --filter @mengche/inquiry-worker check && pnpm test

      - name: Prepare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
        run: |
          node --input-type=module --eval '
            import { writeFileSync } from "node:fs";

            const deploymentCredentials = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"];
            const workerSecrets = ["TURNSTILE_SECRET_KEY", "RATE_LIMIT_SECRET"];
            const requiredValues = [...deploymentCredentials, ...workerSecrets];
            const missingValues = requiredValues.filter((name) => !process.env[name]);

            if (missingValues.length > 0) {
              console.error(`Missing required GitHub Actions secrets: ${missingValues.join(", ")}`);
              process.exit(1);
            }

            writeFileSync(
              `${process.env.RUNNER_TEMP}/inquiry-worker-secrets.json`,
              JSON.stringify(Object.fromEntries(workerSecrets.map((name) => [name, process.env[name]]))),
              { mode: 0o600 }
            );
          '

      - name: Deploy inquiry Worker
        run: >-
          pnpm --filter @mengche/inquiry-worker exec wrangler deploy
          --secrets-file "$RUNNER_TEMP/inquiry-worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove deployment secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/inquiry-worker-secrets.json"
