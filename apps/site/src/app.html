<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://cdn.mengche.dev/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="https://cdn.mengche.dev/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171816" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : 'system';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
